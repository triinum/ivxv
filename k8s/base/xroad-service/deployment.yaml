apiVersion: apps/v1
kind: Deployment
metadata:
  name: xroad-service
  labels:
    app.kubernetes.io/name: xroad-service
    app.kubernetes.io/part-of: ivxv
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xroad-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xroad-service
        app.kubernetes.io/part-of: ivxv
        app.kubernetes.io/component: collector
    spec:
      containers:
        - name: xroad-service
          image: ivxv/xroad-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: service
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: xroad-config
              mountPath: /etc/xroad-service
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: service
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: service
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: xroad-config
          secret:
            secretName: xroad-service-config
            optional: true
