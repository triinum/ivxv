apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-admin
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: collector-admin
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
