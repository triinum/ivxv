apiVersion: apps/v1
kind: Deployment
metadata:
  name: votesorder
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: votesorder
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
