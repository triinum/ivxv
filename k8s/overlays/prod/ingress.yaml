apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivxv-proxy
  labels:
    app.kubernetes.io/part-of: ivxv
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: vote.example.ee
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivxv-admin
  labels:
    app.kubernetes.io/part-of: ivxv
spec:
  ingressClassName: nginx
  rules:
    - host: admin.example.ee
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collector-admin
                port:
                  number: 8080
