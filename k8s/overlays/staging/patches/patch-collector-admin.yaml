apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-admin
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: collector-admin
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
